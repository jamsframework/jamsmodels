name: Library release

# Manually triggered from the Actions tab ("Run workflow") of a fork of
# jamsmodels. Publishes a single model library (plus the libraries it depends
# on) as its own Zenodo record with tools/zenodo_upload.py, in the Zenodo
# account of the fork owner. No GitHub release is created: the Zenodo GitHub
# integration would otherwise archive the whole repository as a new jamsmodels
# version. By default the upload stays a draft on zenodo.org to be checked and
# published there (or deleted); with "publish" it is published directly and
# gets the git tag <library>/<version> in the fork.
#
# Secret (in the fork): ZENODO_TOKEN, a zenodo.org personal access token with
# deposit:write and deposit:actions. The main repository has no such secret,
# so that nobody publishes in someone else's Zenodo account.
on:
  workflow_dispatch:
    inputs:
      library:
        description: 'Model library (directory name, e.g. J2K_Irstea)'
        required: true
      notes:
        description: 'Release note (optional)'
        required: false
        default: ''
      publish:
        description: 'Publish directly (otherwise only a draft on zenodo.org)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM: jamsframework/jamsmodels

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LIBRARY: ${{ inputs.library }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check Zenodo token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::No ZENODO_TOKEN secret. Run this workflow in your own fork of $UPSTREAM with your own Zenodo token as repository secret ZENODO_TOKEN (see the README)."
            exit 1
          fi

      - name: Checkout jamsmodels
        uses: actions/checkout@v5
        with:
          # full history needed to find the most recent commit of the library
          fetch-depth: 0

      - name: Check that the fork is in sync
        run: |
          # the Zenodo record links to the commit in the main repository, so
          # the fork must not contain commits of its own
          git fetch -q "https://github.com/$UPSTREAM" main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not part of $UPSTREAM. Bring the fork up to date with \"Sync fork\" (and discard commits of its own), then run the workflow again."
            exit 1
          fi

      - name: Check library
        run: |
          if ! sed -n 's:.*<module>\(.*\)</module>.*:\1:p' pom.xml | grep -qxF "$LIBRARY"; then
            echo "::error::unknown library: $LIBRARY (not in the <modules> list of pom.xml)"
            exit 1
          fi
          # the library and the sibling libraries it depends on
          MODULES=$(python3 -c "import sys; sys.path.insert(0, 'tools'); from zenodo_authors import with_dependencies; print(' '.join(with_dependencies('.', [sys.argv[1]])))" "$LIBRARY")
          echo "MODULES=$MODULES" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Checkout JAMS framework
        uses: actions/checkout@v5
        with:
          repository: jamsframework/jams
          path: jams

      - name: Build and install JAMS framework
        working-directory: jams
        run: ./mvnw install -pl jams-starter -am -DskipTests -B

      - name: Determine version
        run: |
          VERSION_FILE=jams/jams-main/target/classes/resources/text/version.txt
          API_MAJOR=$(grep '^api.majorversion=' "$VERSION_FILE" | cut -d= -f2)
          API_MINOR=$(grep '^api.minorversion=' "$VERSION_FILE" | cut -d= -f2)
          LIB_DATE=$(git log -1 --format=%cd --date=format:'%Y%m%d' -- $MODULES)
          VERSION="v${API_MAJOR}.${API_MINOR}-${LIB_DATE}"
          if git ls-remote --exit-code --tags origin "refs/tags/$LIBRARY/$VERSION" >/dev/null; then
            echo "::error::$LIBRARY $VERSION was already released (tag $LIBRARY/$VERSION exists)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Register jams-api/jams-main locally
        run: |
          cp jams/jams-api/target/jams-api-*.jar jams-libs/
          cp jams/jams-main/target/jams-main-*.jar jams-libs/
          ./install-jams-libs.sh

      - name: Build library
        run: |
          rm -rf components
          ./mvnw clean package -pl "$LIBRARY" -am -DskipTests -B

      - name: Zip library and sources
        run: |
          (cd components && zip -r "../$LIBRARY-$VERSION.zip" .)
          git archive --format=zip -o "$LIBRARY-$VERSION-src.zip" HEAD -- $MODULES LICENSE COPYING.GPL

      - name: Upload to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          # without pipefail, tee would hide a failed upload
          set -o pipefail
          # the commit in the main repository, not the tag: a draft published by
          # hand on zenodo.org gets no tag, and the fork may be deleted later
          ARGS=(--tag-url "https://github.com/${UPSTREAM}/tree/${GITHUB_SHA}")
          if [ "${{ inputs.publish }}" = true ]; then
            ARGS+=(--publish)
          fi
          if [ -n "$NOTES" ]; then
            ARGS+=(--notes "$NOTES")
          fi
          python3 tools/zenodo_upload.py --library "$LIBRARY" --version "$VERSION" "${ARGS[@]}" \
            "$LIBRARY-$VERSION.zip" "$LIBRARY-$VERSION-src.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        if: inputs.publish
        run: |
          git tag "$LIBRARY/$VERSION"
          git push origin "$LIBRARY/$VERSION"
